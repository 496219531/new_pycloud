syntax = "proto3";

package pycloud.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "com.pycloud.v1";
option go_package = "pycloud/proto/v1;pycloudv1";

// -------------------------
// Common enums
// -------------------------

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_QUEUED = 1;
  TASK_STATUS_RUNNING = 2;
  TASK_STATUS_SUCCEEDED = 3;
  TASK_STATUS_FAILED_USER = 4;
  TASK_STATUS_FAILED_INFRA = 5;
  TASK_STATUS_CANCELLED = 6;
}

enum ExecutionMode {
  EXECUTION_MODE_UNSPECIFIED = 0;
  EXECUTION_MODE_PERSISTENT = 1;
  EXECUTION_MODE_EPHEMERAL = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_REQUEST = 1;
  ERROR_CODE_UNAUTHORIZED = 2;
  ERROR_CODE_UNKNOWN_NODE = 3;
  ERROR_CODE_UNKNOWN_CODE_VERSION = 4;
  ERROR_CODE_DUPLICATE_TASK = 5;
  ERROR_CODE_NO_CREDIT = 6;
  ERROR_CODE_QUEUE_FULL = 7;
  ERROR_CODE_TASK_NOT_FOUND = 8;
  ERROR_CODE_NODE_DRAINING = 9;
  ERROR_CODE_INTERNAL_ERROR = 10;
}

enum ServiceStatus {
  SERVICE_STATUS_UNSPECIFIED = 0;
  SERVICE_STATUS_STARTING = 1;
  SERVICE_STATUS_RUNNING = 2;
  SERVICE_STATUS_DRAINING = 3;
  SERVICE_STATUS_STOPPED = 4;
}

message Error {
  ErrorCode code = 1;
  string message = 2;
  string request_id = 3;
}

message TaskError {
  string type = 1;
  string message = 2;
}

message TransportPayload {
  string codec = 1;
  uint32 version = 2;
  bytes payload = 3;
}

message NodeMetrics {
  int32 queued = 1;
  int32 inflight = 2;
  int32 running = 3;
  int32 credit = 4;
  double cpu_percent = 5;
  double mem_percent = 6;
}

message NodeCapabilityInfo {
  repeated string supported_modes = 1;
  bool supports_transport_payload_bytes = 2;
  bool supports_http_bytes_transport = 3;
  int64 max_grpc_send_bytes = 4;
  int64 max_grpc_recv_bytes = 5;
  int64 max_http_body_bytes = 6;
  int64 max_upload_file_bytes = 7;
  int64 max_upload_total_bytes = 8;
}

message RegisterNodeRequest {
  string node_id = 1;
  string control_addr = 2;
  int32 capacity = 3;
  int32 queue_capacity = 4;
  repeated string tags = 5;
  string version = 6;
  map<string, string> metadata = 7;
  repeated ServiceRouteReport services = 8;
  string node_instance_id = 9;
  NodeCapabilityInfo capability = 10;
}

message RegisterNodeResponse {
  bool ok = 1;
  string node_id = 2;
  int32 lease_ttl_sec = 3;
  int32 heartbeat_interval_sec = 4;
  google.protobuf.Timestamp server_time = 5;
  Error error = 6;
  string node_instance_id = 7;
}

message HeartbeatNodeRequest {
  string node_id = 1;
  google.protobuf.Timestamp timestamp = 2;
  NodeMetrics metrics = 3;
  bool healthy = 4;
  string reason = 5;
  repeated ServiceRouteReport services = 6;
  string node_instance_id = 7;
  NodeCapabilityInfo capability = 8;
}

message HeartbeatNodeResponse {
  bool ok = 1;
  bool accepted = 2;
  int32 next_heartbeat_in_sec = 3;
  bool drain = 4;
  Error error = 5;
}

message ListNodesRequest {
  bool healthy_only = 1;
  repeated string tags = 2;
  int32 limit = 3;
}

message NodeInfo {
  string node_id = 1;
  string control_addr = 2;
  bool healthy = 3;
  google.protobuf.Timestamp last_seen_at = 4;
  int32 capacity = 5;
  int32 queue_capacity = 6;
  int32 queued = 7;
  int32 inflight = 8;
  int32 credit = 9;
  repeated string tags = 10;
  string node_instance_id = 11;
  NodeCapabilityInfo capability = 12;
}

message ListNodesResponse {
  bool ok = 1;
  repeated NodeInfo nodes = 2;
  Error error = 3;
}

message ServiceRouteReport {
  string service_name = 1;
  string service_id = 2;
  ServiceStatus status = 3;
  int32 worker_count = 4;
  int32 alive_workers = 5;
  int32 in_flight = 6;
  google.protobuf.Timestamp lease_expire_at = 7;
  string http_base_url = 8;
  string policy_id = 9;
}

message ListServiceRoutesRequest {
  string service_name = 1;
  bool healthy_only = 2;
  int32 limit = 3;
}

message ServiceRouteInfo {
  string service_name = 1;
  string service_id = 2;
  ServiceStatus status = 3;
  string node_id = 4;
  string control_addr = 5;
  bool node_healthy = 6;
  int32 worker_count = 7;
  int32 alive_workers = 8;
  int32 in_flight = 9;
  google.protobuf.Timestamp lease_expire_at = 10;
  string http_base_url = 11;
  string node_instance_id = 12;
  NodeCapabilityInfo capability = 13;
  string policy_id = 14;
}

message ListServiceRoutesResponse {
  bool ok = 1;
  repeated ServiceRouteInfo routes = 2;
  Error error = 3;
}

// -------------------------
// NodeControl service (client facing)
// -------------------------

service NodeControlService {
  rpc UploadCode(stream UploadCodeRequest) returns (UploadCodeResponse);
  rpc UploadObject(stream UploadObjectRequest) returns (UploadObjectResponse);
  rpc GetObjectMeta(GetObjectMetaRequest) returns (GetObjectMetaResponse);
  rpc DownloadObject(DownloadObjectRequest) returns (stream DownloadObjectChunk);
  rpc PinObject(PinObjectRequest) returns (PinObjectResponse);
  rpc ReleaseObject(ReleaseObjectRequest) returns (ReleaseObjectResponse);
  rpc UpdateRuntimeGlobals(UpdateRuntimeGlobalsRequest) returns (UpdateRuntimeGlobalsResponse);
  rpc GetMetrics(GetMetricsRequest) returns (GetMetricsResponse);
  rpc CreateTaskPool(stream CreateTaskPoolRequest) returns (CreateTaskPoolResponse);
  rpc HeartbeatTaskPool(HeartbeatTaskPoolRequest) returns (HeartbeatTaskPoolResponse);
  rpc SubmitPoolTasks(SubmitPoolTasksRequest) returns (SubmitTasksResponse);
  rpc PullPoolResults(PullPoolResultsRequest) returns (PullResultsResponse);
  rpc CancelPoolJob(CancelPoolJobRequest) returns (CancelJobResponse);
  rpc GetTaskPoolStatus(GetTaskPoolStatusRequest) returns (GetTaskPoolStatusResponse);
  rpc CloseTaskPool(CloseTaskPoolRequest) returns (CloseTaskPoolResponse);
  rpc CreateService(stream CreateServiceRequest) returns (CreateServiceResponse);
  rpc ListServiceMethods(ListServiceMethodsRequest) returns (ListServiceMethodsResponse);
  rpc CallService(CallServiceRequest) returns (CallServiceResponse);
  rpc UpdateServiceGlobals(UpdateServiceGlobalsRequest) returns (UpdateServiceGlobalsResponse);
  rpc HeartbeatService(HeartbeatServiceRequest) returns (HeartbeatServiceResponse);
  rpc EndService(EndServiceRequest) returns (EndServiceResponse);
  rpc GetServiceStatus(GetServiceStatusRequest) returns (GetServiceStatusResponse);
}

message ModuleExportSpec {
  string mode = 1; // decorator | explicit | all | single
  repeated string methods = 2;
  string decorator = 3; // default: pycloud_export
}

message UploadCodeMeta {
  string client_id = 1;
  string sha256 = 2;
  string runtime = 3;
  string entry_module = 4;
  string entry_callable = 5; // legacy single-function field
  string package_format = 6; // py | tar.gz | zip | whl
  ModuleExportSpec export_spec = 7;
  repeated string dependency_allowlist = 8;
  repeated string managed_global_names = 9;
  string code_token = 10;
  string dependency_policy_mode = 11; // prebuilt | node_preinstalled | allow_install
}

message UploadCodeRequest {
  oneof body {
    UploadCodeMeta meta = 1;
    bytes chunk = 2;
  }
}

message UploadCodeResponse {
  bool ok = 1;
  string code_version = 2;
  bool cached = 3;
  int64 size_bytes = 4;
  google.protobuf.Timestamp created_at = 5;
  Error error = 6;
  string code_token = 7;
}

message UploadObjectMeta {
  string object_id = 1;
  string format = 2;
  string integrity_mode = 3; // client_declared | server_authoritative
}

message UploadObjectRequest {
  oneof body {
    UploadObjectMeta meta = 1;
    bytes chunk = 2;
  }
}

message UploadObjectResponse {
  bool ok = 1;
  string object_id = 2;
  string format = 3;
  bool cached = 4;
  int64 size_bytes = 5;
  google.protobuf.Timestamp created_at = 6;
  Error error = 7;
}

message GetObjectMetaRequest {
  string object_id = 1;
}

message GetObjectMetaResponse {
  bool ok = 1;
  bool exists = 2;
  string object_id = 3;
  string format = 4;
  int64 size_bytes = 5;
  google.protobuf.Timestamp created_at = 6;
  Error error = 7;
}

message DownloadObjectRequest {
  string object_id = 1;
}

message DownloadObjectChunk {
  string object_id = 1;
  string format = 2;
  int64 size_bytes = 3;
  bytes chunk = 4;
}

message PinObjectRequest {
  string object_id = 1;
  string ref_id = 2;
}

message PinObjectResponse {
  bool ok = 1;
  bool pinned = 2;
  Error error = 3;
}

message ReleaseObjectRequest {
  string object_id = 1;
  string ref_id = 2;
}

message ReleaseObjectResponse {
  bool ok = 1;
  bool released = 2;
  Error error = 3;
}

message UpdateRuntimeGlobalsRequest {
  string client_id = 1;
  string code_version = 2;
  string runtime_key = 3;
  string code_token = 4;
  google.protobuf.Struct values = 5;
  TransportPayload transport_values = 6;
}

message UpdateRuntimeGlobalsResponse {
  bool ok = 1;
  string code_version = 2;
  string runtime_key = 3;
  string globals_digest = 4;
  repeated string updated_names = 5;
  Error error = 6;
}

message TaskSubmitItem {
  string task_id = 1;
  google.protobuf.Struct payload = 2;
  int32 timeout_hint_sec = 3;
  int32 priority = 4;
  string runtime_key = 5;
  TransportPayload transport_payload = 6;
}

message TaskAccepted {
  string task_id = 1;
  TaskStatus status = 2; // expected: TASK_STATUS_QUEUED
}

message TaskRejected {
  string task_id = 1;
  ErrorCode code = 2;
  string message = 3;
}

message SubmitTasksResponse {
  bool ok = 1;
  repeated TaskAccepted accepted = 2;
  repeated TaskRejected rejected = 3;
  int32 node_credit = 4;
  Error error = 5;
}

message TaskResult {
  string task_id = 1;
  TaskStatus status = 2;
  int32 attempt = 3;
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp finished_at = 5;
  google.protobuf.Struct result = 6;
  TaskError error = 7;
  string job_id = 8;
  TransportPayload transport_result = 9;
}

message PullResultsResponse {
  bool ok = 1;
  repeated TaskResult results = 2;
  string next_cursor = 3;
  Error error = 4;
}

message CancelJobResponse {
  bool ok = 1;
  int32 queued_cancelled = 2;
  int32 running_marked = 3;
  int32 already_done = 4;
  int32 not_found = 5;
  Error error = 6;
}

message GetMetricsRequest {}

message GetMetricsResponse {
  bool ok = 1;
  string node_id = 2;
  int32 queued = 3;
  int32 inflight = 4;
  int32 running = 5;
  int32 credit = 6;
  int32 queue_capacity = 7;
  int32 worker_capacity = 8;
  double cpu_percent = 9;
  double mem_percent = 10;
  int64 uptime_sec = 11;
  Error error = 12;
}

message CreateTaskPoolMeta {
  string owner_client_id = 1;
  string pool_name = 2;
  string sha256 = 3;
  string runtime = 4;
  string entry_module = 5;
  string entry_callable = 6;
  int32 worker_count = 7;
  int32 heartbeat_timeout_sec = 8;
  int32 idle_ttl_sec = 9;
  string package_format = 10;
  repeated string dependency_allowlist = 11;
  repeated string managed_global_names = 12;
  string dependency_policy_mode = 13; // prebuilt | node_preinstalled | allow_install
}

message CreateTaskPoolRequest {
  oneof body {
    CreateTaskPoolMeta meta = 1;
    bytes chunk = 2;
  }
}

message CreateTaskPoolResponse {
  bool ok = 1;
  string pool_id = 2;
  string code_version = 3;
  int32 worker_count = 4;
  int32 heartbeat_timeout_sec = 5;
  string owner_client_id = 6;
  string pool_token = 7;
  Error error = 8;
}

message SubmitPoolTasksRequest {
  string pool_id = 1;
  string pool_token = 2;
  repeated TaskSubmitItem tasks = 3;
  string job_id = 4;
}

message PullPoolResultsRequest {
  string pool_id = 1;
  string pool_token = 2;
  int32 limit = 3;
  int32 wait_ms = 4;
  string cursor = 5;
}

message HeartbeatTaskPoolRequest {
  string owner_client_id = 1;
  string pool_id = 2;
  int64 seq = 3;
  google.protobuf.Timestamp timestamp = 4;
  string pool_token = 5;
}

message HeartbeatTaskPoolResponse {
  bool ok = 1;
  bool accepted = 2;
  int32 next_heartbeat_in_sec = 3;
  Error error = 4;
}

message CancelPoolJobRequest {
  string pool_id = 1;
  string pool_token = 2;
  string job_id = 3;
  string reason = 4;
}

message GetTaskPoolStatusRequest {
  string pool_id = 1;
  string pool_token = 2;
}

message TaskPoolStatusInfo {
  string pool_id = 1;
  string owner_client_id = 2;
  string pool_name = 3;
  string code_version = 4;
  int32 worker_count = 5;
  int32 heartbeat_timeout_sec = 6;
  string status = 7;
  int32 task_count = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp last_heartbeat_at = 10;
  google.protobuf.Timestamp lease_expire_at = 11;
}

message GetTaskPoolStatusResponse {
  bool ok = 1;
  TaskPoolStatusInfo pool = 2;
  Error error = 3;
}

message CloseTaskPoolRequest {
  string owner_client_id = 1;
  string pool_id = 2;
  string pool_token = 3;
  string reason = 4;
}

message CloseTaskPoolResponse {
  bool ok = 1;
  bool accepted = 2;
  Error error = 3;
}

message CreateServiceMeta {
  string owner_client_id = 1;
  string service_name = 2;
  string sha256 = 3;
  string runtime = 4;
  string entry_module = 5;
  string entry_callable = 6; // legacy single-function field
  int32 worker_count = 7;
  int32 heartbeat_timeout_sec = 8;
  int32 idle_ttl_sec = 9;
  bool expose_http = 10;
  string package_format = 11; // py | tar.gz | zip | whl
  ModuleExportSpec export_spec = 12;
  repeated string dependency_allowlist = 13;
  repeated string managed_global_names = 14;
  string dependency_policy_mode = 15; // prebuilt | node_preinstalled | allow_install
  string policy_id = 16;
}

message CreateServiceRequest {
  oneof body {
    CreateServiceMeta meta = 1;
    bytes chunk = 2;
  }
}

message CreateServiceResponse {
  bool ok = 1;
  string service_id = 2;
  string code_version = 3;
  ServiceStatus status = 4;
  int32 worker_count = 5;
  int32 heartbeat_timeout_sec = 6;
  string owner_client_id = 7;
  string service_token = 8;
  string http_base_url = 9;
  Error error = 10;
  string policy_id = 11;
}

message ServiceMethodInfo {
  string method = 1;
  string qualified_name = 2;
  string doc = 3;
}

message ListServiceMethodsRequest {
  string service_id = 1;
  bool include_docs = 2;
}

message ListServiceMethodsResponse {
  bool ok = 1;
  string service_id = 2;
  repeated ServiceMethodInfo methods = 3;
  Error error = 4;
}

message CallServiceRequest {
  string service_id = 1;
  string method = 2;
  google.protobuf.Struct payload = 3;
  double timeout_sec = 4;
  string service_token = 5;
  TransportPayload transport_payload = 6;
}

message CallServiceResponse {
  bool ok = 1;
  string service_id = 2;
  string method = 3;
  google.protobuf.Struct data = 4;
  TaskError task_error = 5;
  Error error = 6;
  TransportPayload transport_data = 7;
}

message UpdateServiceGlobalsRequest {
  string owner_client_id = 1;
  string service_id = 2;
  string service_token = 3;
  google.protobuf.Struct values = 4;
  TransportPayload transport_values = 5;
}

message UpdateServiceGlobalsResponse {
  bool ok = 1;
  string service_id = 2;
  string globals_digest = 3;
  repeated string updated_names = 4;
  Error error = 5;
}

message HeartbeatServiceRequest {
  string owner_client_id = 1;
  string service_id = 2;
  int64 seq = 3;
  google.protobuf.Timestamp timestamp = 4;
  string service_token = 5;
}

message HeartbeatServiceResponse {
  bool ok = 1;
  bool accepted = 2;
  ServiceStatus status = 3;
  int32 next_heartbeat_in_sec = 4;
  Error error = 5;
}

message EndServiceRequest {
  string owner_client_id = 1;
  string service_id = 2;
  string reason = 3;
  string service_token = 4;
}

message EndServiceResponse {
  bool ok = 1;
  bool accepted = 2;
  ServiceStatus status = 3;
  Error error = 4;
}

message GetServiceStatusRequest {
  string service_id = 1;
}

message ServiceStatusInfo {
  string service_id = 1;
  string owner_client_id = 2;
  string service_name = 3;
  string code_version = 4;
  ServiceStatus status = 5;
  int32 worker_count = 6;
  int32 alive_workers = 7;
  int32 in_flight = 8;
  int32 queued = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp last_heartbeat_at = 11;
  google.protobuf.Timestamp lease_expire_at = 12;
  string http_base_url = 13;
  string policy_id = 14;
}

message GetServiceStatusResponse {
  bool ok = 1;
  ServiceStatusInfo service = 2;
  Error error = 3;
}
