syntax = "proto3";

package pycloud.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "com.pycloud.v1";
option go_package = "pycloud/proto/v1;pycloudv1";

// -------------------------
// Common enums
// -------------------------

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_QUEUED = 1;
  TASK_STATUS_RUNNING = 2;
  TASK_STATUS_SUCCEEDED = 3;
  TASK_STATUS_FAILED_USER = 4;
  TASK_STATUS_FAILED_INFRA = 5;
  TASK_STATUS_CANCELLED = 6;
}

enum ExecutionMode {
  EXECUTION_MODE_UNSPECIFIED = 0;
  EXECUTION_MODE_PERSISTENT = 1;
  EXECUTION_MODE_EPHEMERAL = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_REQUEST = 1;
  ERROR_CODE_UNAUTHORIZED = 2;
  ERROR_CODE_UNKNOWN_NODE = 3;
  ERROR_CODE_UNKNOWN_CODE_VERSION = 4;
  ERROR_CODE_DUPLICATE_TASK = 5;
  ERROR_CODE_NO_CREDIT = 6;
  ERROR_CODE_QUEUE_FULL = 7;
  ERROR_CODE_TASK_NOT_FOUND = 8;
  ERROR_CODE_NODE_DRAINING = 9;
  ERROR_CODE_INTERNAL_ERROR = 10;
}

enum ServiceStatus {
  SERVICE_STATUS_UNSPECIFIED = 0;
  SERVICE_STATUS_STARTING = 1;
  SERVICE_STATUS_RUNNING = 2;
  SERVICE_STATUS_DRAINING = 3;
  SERVICE_STATUS_STOPPED = 4;
}

message Error {
  ErrorCode code = 1;
  string message = 2;
  string request_id = 3;
}

message TaskError {
  string type = 1;
  string message = 2;
}

message NodeMetrics {
  int32 queued = 1;
  int32 inflight = 2;
  int32 running = 3;
  int32 credit = 4;
  double cpu_percent = 5;
  double mem_percent = 6;
}

message RegisterNodeRequest {
  string node_id = 1;
  string control_addr = 2;
  int32 capacity = 3;
  int32 queue_capacity = 4;
  repeated string tags = 5;
  string version = 6;
  map<string, string> metadata = 7;
  repeated ServiceRouteReport services = 8;
}

message RegisterNodeResponse {
  bool ok = 1;
  string node_id = 2;
  int32 lease_ttl_sec = 3;
  int32 heartbeat_interval_sec = 4;
  google.protobuf.Timestamp server_time = 5;
  Error error = 6;
}

message HeartbeatNodeRequest {
  string node_id = 1;
  google.protobuf.Timestamp timestamp = 2;
  NodeMetrics metrics = 3;
  bool healthy = 4;
  string reason = 5;
  repeated ServiceRouteReport services = 6;
}

message HeartbeatNodeResponse {
  bool ok = 1;
  bool accepted = 2;
  int32 next_heartbeat_in_sec = 3;
  bool drain = 4;
  Error error = 5;
}

message ListNodesRequest {
  bool healthy_only = 1;
  repeated string tags = 2;
  int32 limit = 3;
}

message NodeInfo {
  string node_id = 1;
  string control_addr = 2;
  bool healthy = 3;
  google.protobuf.Timestamp last_seen_at = 4;
  int32 capacity = 5;
  int32 queue_capacity = 6;
  int32 queued = 7;
  int32 inflight = 8;
  int32 credit = 9;
  repeated string tags = 10;
}

message ListNodesResponse {
  bool ok = 1;
  repeated NodeInfo nodes = 2;
  Error error = 3;
}

message ServiceRouteReport {
  string service_name = 1;
  string service_id = 2;
  ServiceStatus status = 3;
  int32 worker_count = 4;
  int32 alive_workers = 5;
  int32 in_flight = 6;
  google.protobuf.Timestamp lease_expire_at = 7;
  string http_base_url = 8;
}

message ListServiceRoutesRequest {
  string service_name = 1;
  bool healthy_only = 2;
  int32 limit = 3;
}

message ServiceRouteInfo {
  string service_name = 1;
  string service_id = 2;
  ServiceStatus status = 3;
  string node_id = 4;
  string control_addr = 5;
  bool node_healthy = 6;
  int32 worker_count = 7;
  int32 alive_workers = 8;
  int32 in_flight = 9;
  google.protobuf.Timestamp lease_expire_at = 10;
  string http_base_url = 11;
}

message ListServiceRoutesResponse {
  bool ok = 1;
  repeated ServiceRouteInfo routes = 2;
  Error error = 3;
}

// -------------------------
// NodeControl service (client facing)
// -------------------------

service NodeControlService {
  rpc UploadCode(stream UploadCodeRequest) returns (UploadCodeResponse);
  rpc UploadObject(stream UploadObjectRequest) returns (UploadObjectResponse);
  rpc DownloadObject(DownloadObjectRequest) returns (stream DownloadObjectChunk);
  rpc TaskStream(stream TaskStreamRequest) returns (stream TaskStreamResponse);
  rpc SubmitTasks(SubmitTasksRequest) returns (SubmitTasksResponse);
  rpc PullResults(PullResultsRequest) returns (PullResultsResponse);
  rpc CancelTasks(CancelTasksRequest) returns (CancelTasksResponse);
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);
  rpc GetMetrics(GetMetricsRequest) returns (GetMetricsResponse);
  rpc CreateService(stream CreateServiceRequest) returns (CreateServiceResponse);
  rpc ListServiceMethods(ListServiceMethodsRequest) returns (ListServiceMethodsResponse);
  rpc CallService(CallServiceRequest) returns (CallServiceResponse);
  rpc HeartbeatService(HeartbeatServiceRequest) returns (HeartbeatServiceResponse);
  rpc EndService(EndServiceRequest) returns (EndServiceResponse);
  rpc GetServiceStatus(GetServiceStatusRequest) returns (GetServiceStatusResponse);
}

message ModuleExportSpec {
  string mode = 1; // decorator | explicit | all | single
  repeated string methods = 2;
  string decorator = 3; // default: pycloud_export
}

message UploadCodeMeta {
  string client_id = 1;
  string sha256 = 2;
  string runtime = 3;
  string entry_module = 4;
  string entry_callable = 5; // legacy single-function field
  string package_format = 6; // py | tar.gz | zip | whl
  ModuleExportSpec export_spec = 7;
  repeated string dependency_allowlist = 8;
}

message UploadCodeRequest {
  oneof body {
    UploadCodeMeta meta = 1;
    bytes chunk = 2;
  }
}

message UploadCodeResponse {
  bool ok = 1;
  string code_version = 2;
  bool cached = 3;
  int64 size_bytes = 4;
  google.protobuf.Timestamp created_at = 5;
  Error error = 6;
}

message UploadObjectMeta {
  string object_id = 1;
  string format = 2;
}

message UploadObjectRequest {
  oneof body {
    UploadObjectMeta meta = 1;
    bytes chunk = 2;
  }
}

message UploadObjectResponse {
  bool ok = 1;
  string object_id = 2;
  string format = 3;
  bool cached = 4;
  int64 size_bytes = 5;
  google.protobuf.Timestamp created_at = 6;
  Error error = 7;
}

message DownloadObjectRequest {
  string object_id = 1;
}

message DownloadObjectChunk {
  string object_id = 1;
  string format = 2;
  int64 size_bytes = 3;
  bytes chunk = 4;
}

message TaskSubmitItem {
  string task_id = 1;
  google.protobuf.Struct payload = 2;
  int32 timeout_hint_sec = 3;
  int32 priority = 4;
  string runtime_key = 5;
}

message SubmitTasksRequest {
  string client_id = 1;
  string code_version = 2;
  ExecutionMode execution_mode = 3;
  repeated TaskSubmitItem tasks = 4;
  string job_id = 5;
}

message TaskAccepted {
  string task_id = 1;
  TaskStatus status = 2; // expected: TASK_STATUS_QUEUED
}

message TaskRejected {
  string task_id = 1;
  ErrorCode code = 2;
  string message = 3;
}

message SubmitTasksResponse {
  bool ok = 1;
  repeated TaskAccepted accepted = 2;
  repeated TaskRejected rejected = 3;
  int32 node_credit = 4;
  Error error = 5;
}

message PullResultsRequest {
  string client_id = 1;
  int32 limit = 2;
  int32 wait_ms = 3;
  string cursor = 4;
}

message TaskResult {
  string task_id = 1;
  TaskStatus status = 2;
  int32 attempt = 3;
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp finished_at = 5;
  google.protobuf.Struct result = 6;
  TaskError error = 7;
  string job_id = 8;
}

message PullResultsResponse {
  bool ok = 1;
  repeated TaskResult results = 2;
  string next_cursor = 3;
  Error error = 4;
}

message TaskStreamOpen {
  string client_id = 1;
  string code_version = 2;
  int32 result_limit = 3;
  int32 result_wait_ms = 4;
}

message TaskStreamOpenAck {
  string client_id = 1;
  string code_version = 2;
  int32 node_credit = 3;
}

message TaskStreamSubmit {
  string request_id = 1;
  string job_id = 2;
  ExecutionMode execution_mode = 3;
  repeated TaskSubmitItem tasks = 4;
}

message TaskStreamSubmitAck {
  string request_id = 1;
  string job_id = 2;
  repeated TaskAccepted accepted = 3;
  repeated TaskRejected rejected = 4;
  int32 node_credit = 5;
  Error error = 6;
}

message TaskStreamResultBatch {
  repeated TaskResult results = 1;
  string next_cursor = 2;
  int32 node_credit = 3;
}

message TaskStreamCancelJob {
  string request_id = 1;
  string job_id = 2;
  string reason = 3;
}

message TaskStreamCancelJobAck {
  string request_id = 1;
  string job_id = 2;
  int32 queued_cancelled = 3;
  int32 running_marked = 4;
  int32 already_done = 5;
  int32 not_found = 6;
  Error error = 7;
}

message TaskStreamCreditUpdate {
  int32 node_credit = 1;
  int32 queued = 2;
  int32 inflight = 3;
  int32 running = 4;
}

message TaskStreamClose {
  bool drain = 1;
}

message TaskStreamClosed {
  string reason = 1;
  int32 node_credit = 2;
}

message TaskStreamRequest {
  oneof body {
    TaskStreamOpen open = 1;
    TaskStreamSubmit submit = 2;
    TaskStreamCancelJob cancel_job = 3;
    TaskStreamClose close = 4;
  }
}

message TaskStreamResponse {
  oneof body {
    TaskStreamOpenAck open_ack = 1;
    TaskStreamSubmitAck submit_ack = 2;
    TaskStreamResultBatch result_batch = 3;
    TaskStreamCancelJobAck cancel_job_ack = 4;
    TaskStreamCreditUpdate credit_update = 5;
    TaskStreamClosed closed = 6;
    Error error = 7;
  }
}

message CancelTasksRequest {
  string client_id = 1;
  repeated string task_ids = 2;
  string reason = 3;
}

message CancelTasksResponse {
  bool ok = 1;
  repeated string cancelled = 2;
  repeated string not_found = 3;
  repeated string already_done = 4;
  Error error = 5;
}

message CancelJobRequest {
  string client_id = 1;
  string job_id = 2;
  string reason = 3;
}

message CancelJobResponse {
  bool ok = 1;
  int32 queued_cancelled = 2;
  int32 running_marked = 3;
  int32 already_done = 4;
  int32 not_found = 5;
  Error error = 6;
}

message GetMetricsRequest {}

message GetMetricsResponse {
  bool ok = 1;
  string node_id = 2;
  int32 queued = 3;
  int32 inflight = 4;
  int32 running = 5;
  int32 credit = 6;
  int32 queue_capacity = 7;
  int32 worker_capacity = 8;
  double cpu_percent = 9;
  double mem_percent = 10;
  int64 uptime_sec = 11;
  Error error = 12;
}

message CreateServiceMeta {
  string owner_client_id = 1;
  string service_name = 2;
  string sha256 = 3;
  string runtime = 4;
  string entry_module = 5;
  string entry_callable = 6; // legacy single-function field
  int32 worker_count = 7;
  int32 heartbeat_timeout_sec = 8;
  int32 idle_ttl_sec = 9;
  bool expose_http = 10;
  string package_format = 11; // py | tar.gz | zip | whl
  ModuleExportSpec export_spec = 12;
  repeated string dependency_allowlist = 13;
}

message CreateServiceRequest {
  oneof body {
    CreateServiceMeta meta = 1;
    bytes chunk = 2;
  }
}

message CreateServiceResponse {
  bool ok = 1;
  string service_id = 2;
  string code_version = 3;
  ServiceStatus status = 4;
  int32 worker_count = 5;
  int32 heartbeat_timeout_sec = 6;
  string owner_client_id = 7;
  string service_token = 8;
  string http_base_url = 9;
  Error error = 10;
}

message ServiceMethodInfo {
  string method = 1;
  string qualified_name = 2;
  string doc = 3;
}

message ListServiceMethodsRequest {
  string service_id = 1;
  bool include_docs = 2;
}

message ListServiceMethodsResponse {
  bool ok = 1;
  string service_id = 2;
  repeated ServiceMethodInfo methods = 3;
  Error error = 4;
}

message CallServiceRequest {
  string service_id = 1;
  string method = 2;
  google.protobuf.Struct payload = 3;
  double timeout_sec = 4;
  string service_token = 5;
}

message CallServiceResponse {
  bool ok = 1;
  string service_id = 2;
  string method = 3;
  google.protobuf.Struct data = 4;
  TaskError task_error = 5;
  Error error = 6;
}

message HeartbeatServiceRequest {
  string owner_client_id = 1;
  string service_id = 2;
  int64 seq = 3;
  google.protobuf.Timestamp timestamp = 4;
  string service_token = 5;
}

message HeartbeatServiceResponse {
  bool ok = 1;
  bool accepted = 2;
  ServiceStatus status = 3;
  int32 next_heartbeat_in_sec = 4;
  Error error = 5;
}

message EndServiceRequest {
  string owner_client_id = 1;
  string service_id = 2;
  string reason = 3;
  string service_token = 4;
}

message EndServiceResponse {
  bool ok = 1;
  bool accepted = 2;
  ServiceStatus status = 3;
  Error error = 4;
}

message GetServiceStatusRequest {
  string service_id = 1;
}

message ServiceStatusInfo {
  string service_id = 1;
  string owner_client_id = 2;
  string service_name = 3;
  string code_version = 4;
  ServiceStatus status = 5;
  int32 worker_count = 6;
  int32 alive_workers = 7;
  int32 in_flight = 8;
  int32 queued = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp last_heartbeat_at = 11;
  google.protobuf.Timestamp lease_expire_at = 12;
  string http_base_url = 13;
}

message GetServiceStatusResponse {
  bool ok = 1;
  ServiceStatusInfo service = 2;
  Error error = 3;
}

message PollTaskRequest {
  string worker_id = 1;
  int32 max_tasks = 2; // V1 uses 1 by default
}

message TaskEnvelope {
  string task_id = 1;
  string code_version = 2;
  int32 attempt = 3;
  ExecutionMode execution_mode = 4;
  google.protobuf.Struct payload = 5;
  string lease_id = 6;
  int32 lease_ttl_sec = 7;
}

message PollTaskResponse {
  bool ok = 1;
  oneof state {
    TaskEnvelope task = 2;
    google.protobuf.Empty idle = 3;
  }
  Error error = 4;
}

message WorkerProgress {
  int64 done = 1;
  int64 total = 2;
}

message HeartbeatTaskRequest {
  string worker_id = 1;
  string task_id = 2;
  int32 attempt = 3;
  google.protobuf.Timestamp timestamp = 4;
  bool child_alive = 5;
  WorkerProgress progress = 6;
}

message HeartbeatTaskResponse {
  bool ok = 1;
  bool accepted = 2;
  bool cancel_requested = 3;
  Error error = 4;
}

message ReportResultRequest {
  string worker_id = 1;
  string task_id = 2;
  int32 attempt = 3;
  TaskStatus status = 4; // expected: SUCCEEDED / FAILED_USER
  google.protobuf.Struct result = 5;
  TaskError error = 6;
  google.protobuf.Timestamp started_at = 7;
  google.protobuf.Timestamp finished_at = 8;
}

message ReportResultResponse {
  bool ok = 1;
  bool accepted = 2;
  Error error = 3;
}
