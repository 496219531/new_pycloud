openapi: 3.0.3
info:
  title: PyCloud HTTP API
  version: "1.0.0"
  description: >
    Actual HTTP-facing surface implemented by the current control-plane runtime.
    NodeControl gRPC methods are documented separately in `GRPC_CONTRACT_V1.md`.

servers:
  - url: http://controlplane.internal
    description: ControlPlane / InfoCenter HTTP entry

tags:
  - name: InfoCenter
  - name: JobQueue
  - name: ServiceGateway

security:
  - BearerAuth: []

paths:
  /nodes/register:
    post:
      tags: [InfoCenter]
      summary: Register a node instance
      operationId: registerNode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeRegisterRequest"
      responses:
        "200":
          description: Registration accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeRegisterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /nodes/heartbeat:
    post:
      tags: [InfoCenter]
      summary: Heartbeat for a registered node instance
      operationId: heartbeatNode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeHeartbeatRequest"
      responses:
        "200":
          description: Heartbeat accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeHeartbeatResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /nodes:
    get:
      tags: [InfoCenter]
      summary: List discovered nodes
      operationId: listNodes
      parameters:
        - in: query
          name: healthy_only
          required: false
          schema:
            type: boolean
            default: true
        - in: query
          name: tags
          required: false
          description: Comma-separated tag filter.
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 100
      responses:
        "200":
          description: Node list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodesListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /services/routes:
    get:
      tags: [InfoCenter]
      summary: List service routes known by InfoCenter
      operationId: listServiceRoutes
      parameters:
        - in: query
          name: service_name
          required: false
          schema:
            type: string
        - in: query
          name: healthy_only
          required: false
          schema:
            type: boolean
            default: true
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 500
      responses:
        "200":
          description: Service routes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRoutesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /data/register:
    post:
      tags: [InfoCenter]
      summary: Register a control-plane DataRef entry
      operationId: registerDataRef
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataRefRegisterRequest"
      responses:
        "200":
          description: DataRef entry registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataRefEntryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /data/touch:
    post:
      tags: [InfoCenter]
      summary: Refresh a staged DataRef TTL
      operationId: touchDataRef
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ref_id]
              properties:
                ref_id:
                  type: string
      responses:
        "200":
          description: Ref TTL refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataRefEntryResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /data/release:
    post:
      tags: [InfoCenter]
      summary: Release a staged DataRef handle
      operationId: releaseDataRef
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ref_id]
              properties:
                ref_id:
                  type: string
      responses:
        "200":
          description: Ref released
          content:
            application/json:
              schema:
                type: object
                required: [ok, released]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  released:
                    type: boolean
        "404":
          $ref: "#/components/responses/NotFound"

  /data/refs:
    get:
      tags: [InfoCenter]
      summary: List registered DataRef entries
      operationId: listDataRefs
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1000
        - in: query
          name: node_id
          required: false
          schema:
            type: string
        - in: query
          name: node_instance_id
          required: false
          schema:
            type: string
      responses:
        "200":
          description: DataRef entries
          content:
            application/json:
              schema:
                type: object
                required: [ok, refs]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  refs:
                    type: array
                    items:
                      $ref: "#/components/schemas/DataRefEntry"

  /data/resolve/{ref_id}:
    get:
      tags: [InfoCenter]
      summary: Resolve a DataRef entry
      operationId: resolveDataRef
      parameters:
        - in: path
          name: ref_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resolved DataRef entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataRefEntryResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /jobs/submit:
    post:
      tags: [JobQueue]
      summary: Submit a job directly to the embedded job queue
      operationId: submitJobDirect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobEnvelopeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /jobs/{job_id}:
    get:
      tags: [JobQueue]
      summary: Query a job from the embedded job queue
      operationId: getJobDirect
      parameters:
        - in: path
          name: job_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobEnvelopeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"

  /jobs/{job_id}/cancel:
    post:
      tags: [JobQueue]
      summary: Cancel a job in the embedded job queue
      operationId: cancelJobDirect
      parameters:
        - in: path
          name: job_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job cancellation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobEnvelopeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"

  /svc/{service_name}/call/{method}:
    post:
      tags: [ServiceGateway]
      summary: Call a service through the ControlPlane gateway
      operationId: callServiceByName
      parameters:
        - in: path
          name: service_name
          required: true
          schema:
            type: string
        - in: path
          name: method
          required: true
          schema:
            type: string
        - in: query
          name: timeout_sec
          required: false
          schema:
            type: number
            format: float
            minimum: 0.1
            default: 60
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Service call result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceCallResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/Unavailable"

  /svc/{service_name}/methods:
    get:
      tags: [ServiceGateway]
      summary: List exported methods for a routed service
      operationId: listServiceMethodsByName
      parameters:
        - in: path
          name: service_name
          required: true
          schema:
            type: string
        - in: query
          name: include_docs
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Exported methods
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceMethodsResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/Unavailable"

  /svc/{service_name}/status:
    get:
      tags: [ServiceGateway]
      summary: Query routed service status by service name
      operationId: getServiceGatewayStatus
      parameters:
        - in: path
          name: service_name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Gateway route snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayStatusResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/Unavailable"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token

  responses:
    BadRequest:
      description: Invalid request payload or parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Request conflicts with current state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unavailable:
      description: Upstream service unavailable or route failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          enum: [false]
        error:
          type: string

    NodeMetrics:
      type: object
      additionalProperties: false
      properties:
        queued:
          type: integer
          minimum: 0
        inflight:
          type: integer
          minimum: 0
        running:
          type: integer
          minimum: 0
        credit:
          type: integer
        cpu_percent:
          type: number
          format: float
        mem_percent:
          type: number
          format: float

    NodeServiceReport:
      type: object
      additionalProperties: true
      properties:
        service_name:
          type: string
        service_id:
          type: string
        status:
          type: integer
        worker_count:
          type: integer
        alive_workers:
          type: integer
        in_flight:
          type: integer
        http_base_url:
          type: string

    NodeTaskPoolReport:
      type: object
      additionalProperties: true

    NodeRegisterRequest:
      type: object
      required: [node_id, control_addr, capacity, queue_capacity]
      properties:
        node_id:
          type: string
        node_instance_id:
          type: string
        control_addr:
          type: string
        capacity:
          type: integer
          minimum: 1
        queue_capacity:
          type: integer
          minimum: 1
        tags:
          type: array
          items:
            type: string
        version:
          type: string
        python_version:
          type: string
        metadata:
          type: object
          additionalProperties: true
        services:
          type: array
          items:
            $ref: "#/components/schemas/NodeServiceReport"
        task_pools:
          type: array
          items:
            $ref: "#/components/schemas/NodeTaskPoolReport"
        active_runtimes:
          type: array
          items:
            type: string
        service_worker_capacity:
          type: integer
        service_worker_used:
          type: integer
        task_pool_worker_capacity:
          type: integer
        task_pool_worker_used:
          type: integer

    NodeHeartbeatRequest:
      type: object
      required: [node_id, healthy]
      properties:
        node_id:
          type: string
        node_instance_id:
          type: string
        healthy:
          type: boolean
        metrics:
          $ref: "#/components/schemas/NodeMetrics"
        metadata:
          type: object
          additionalProperties: true
        services:
          type: array
          items:
            $ref: "#/components/schemas/NodeServiceReport"
        task_pools:
          type: array
          items:
            $ref: "#/components/schemas/NodeTaskPoolReport"
        python_version:
          type: string
        active_runtimes:
          type: array
          items:
            type: string
        service_worker_capacity:
          type: integer
        service_worker_used:
          type: integer
        task_pool_worker_capacity:
          type: integer
        task_pool_worker_used:
          type: integer

    NodeInfo:
      type: object
      additionalProperties: true
      properties:
        node_instance_id:
          type: string
        node_id:
          type: string
        control_addr:
          type: string
        healthy:
          type: boolean
        schedulable:
          type: boolean
        drain:
          type: boolean
        reason:
          type: string
        capacity:
          type: integer
        queue_capacity:
          type: integer
        queued:
          type: integer
        inflight:
          type: integer
        running:
          type: integer
        credit:
          type: integer
        python_version:
          type: string
        active_runtimes:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        services:
          type: array
          items:
            $ref: "#/components/schemas/NodeServiceReport"
        task_pools:
          type: array
          items:
            $ref: "#/components/schemas/NodeTaskPoolReport"

    NodeRegisterResponse:
      type: object
      required: [ok, heartbeat_interval_sec, node]
      properties:
        ok:
          type: boolean
          enum: [true]
        heartbeat_interval_sec:
          type: integer
        node:
          $ref: "#/components/schemas/NodeInfo"

    NodeHeartbeatResponse:
      type: object
      required: [ok, accepted, next_heartbeat_in_sec]
      properties:
        ok:
          type: boolean
          enum: [true]
        accepted:
          type: boolean
        next_heartbeat_in_sec:
          type: integer

    NodesListResponse:
      type: object
      required: [ok, nodes]
      properties:
        ok:
          type: boolean
          enum: [true]
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/NodeInfo"

    ServiceRouteInfo:
      type: object
      additionalProperties: true
      properties:
        service_name:
          type: string
        service_id:
          type: string
        status:
          type: integer
        node_instance_id:
          type: string
        node_id:
          type: string
        control_addr:
          type: string
        node_healthy:
          type: boolean
        worker_count:
          type: integer
        alive_workers:
          type: integer
        in_flight:
          type: integer
        reported_in_flight:
          type: integer
        received_count:
          type: integer
        returned_count:
          type: integer
        ema_child_invoke_ms:
          type: number
          format: float
        ema_samples:
          type: integer
        predicted_busy:
          type: number
          format: float
        http_base_url:
          type: string
        lease_expire_at:
          type: string
          format: date-time

    ServiceRoutesResponse:
      type: object
      required: [ok, routes]
      properties:
        ok:
          type: boolean
          enum: [true]
        routes:
          type: array
          items:
            $ref: "#/components/schemas/ServiceRouteInfo"

    DataRefReplica:
      type: object
      properties:
        node_id:
          type: string
        node_instance_id:
          type: string
        control_addr:
          type: string

    DataRefEntry:
      type: object
      required: [ref_id, storage_id, format, materialize_as, ttl_sec]
      properties:
        ref_id:
          type: string
        storage_id:
          type: string
        logical_type:
          type: string
        format:
          type: string
        size_bytes:
          type: integer
        materialize_as:
          type: string
        locator_kind:
          type: string
        locator_token:
          type: string
        consume_on_read:
          type: boolean
        node_id:
          type: string
        node_instance_id:
          type: string
        control_addr:
          type: string
        replicas:
          type: array
          items:
            $ref: "#/components/schemas/DataRefReplica"
        created_at:
          type: string
          format: date-time
        last_at:
          type: string
          format: date-time
        ttl_sec:
          type: integer

    DataRefPayload:
      type: object
      required: [__pycloud_data_ref__]
      properties:
        __pycloud_data_ref__:
          type: object
          additionalProperties: true

    DataRefRegisterRequest:
      type: object
      required: [ref]
      properties:
        ref:
          $ref: "#/components/schemas/DataRefPayload"
        ttl_sec:
          type: integer
        node_id:
          type: string
        node_instance_id:
          type: string
        control_addr:
          type: string
        locator_kind:
          type: string
        locator_token:
          type: string
        replicas:
          type: array
          items:
            $ref: "#/components/schemas/DataRefReplica"

    DataRefEntryResponse:
      type: object
      required: [ok, entry]
      properties:
        ok:
          type: boolean
          enum: [true]
        entry:
          $ref: "#/components/schemas/DataRefEntry"

    JobEnvelopeResponse:
      type: object
      required: [ok, job]
      properties:
        ok:
          type: boolean
          enum: [true]
        job:
          type: object
          additionalProperties: true

    ServiceMethodInfo:
      type: object
      required: [method, qualified_name, doc]
      properties:
        method:
          type: string
        qualified_name:
          type: string
        doc:
          type: string

    ServiceMethodsResponse:
      type: object
      required: [ok, methods]
      properties:
        ok:
          type: boolean
          enum: [true]
        service_name:
          type: string
        service_id:
          type: string
        methods:
          type: array
          items:
            $ref: "#/components/schemas/ServiceMethodInfo"

    GatewayStatusResponse:
      type: object
      required: [ok, service_name, route_count, routes]
      properties:
        ok:
          type: boolean
          enum: [true]
        service_name:
          type: string
        refreshed_at:
          type: string
          format: date-time
        route_count:
          type: integer
        routes:
          type: array
          items:
            $ref: "#/components/schemas/ServiceRouteInfo"

    ServiceCallResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          additionalProperties: true
